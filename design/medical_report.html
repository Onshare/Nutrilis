<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nutrilis - 体检分析报告</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.3.4.3.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.1.0.7.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/echarts.min.5.4.3.js"></script>
<style>
        :root { --primary: #A1C298; --secondary: #6B4F4F; --accent: #D4B996; --bg: #F9F9F7; }
        .app-container { width: 375px; height: 812px; background: #FFF; border: 8px solid #000; border-radius: 40px; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        .scrollbox { flex: 1; overflow-y: auto; padding-bottom: 40px; }
        .scrollbox::-webkit-scrollbar { display: none; }
        .clickable { transition: all 0.2s; cursor: pointer; }
        .clickable:active { transform: scale(0.95); opacity: 0.8; }
        .report-section { background: white; border-radius: 24px; padding: 20px; border: 1px solid #F0F0F0; margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
    </style>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">
<div class="app-container">
<header class="h-[88px] pt-10 px-4 flex items-center border-b border-gray-100 sticky top-0 bg-white/80 backdrop-blur-md z-50">
<a class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-50 clickable" href="profile.html">
<iconify-icon class="text-xl text-gray-800" icon="solar:alt-arrow-left-linear"></iconify-icon>
</a>
<h1 class="ml-4 font-bold text-lg text-gray-800">体检分析报告</h1>
</header>
<div class="scrollbox px-6 pt-6">
<!-- Summary Card -->
<div class="report-section bg-gradient-to-br from-[#A1C298] to-[#B8D4B0] border-none text-white">
<div class="flex justify-between items-start">
<div>
<p class="text-[10px] opacity-80 uppercase tracking-widest font-bold">Health Score</p>
<h2 class="text-4xl font-black mt-1">82分</h2>
</div>
<div class="text-right">
<p class="text-xs font-bold">状况：良好</p>
<p class="text-[10px] opacity-70">更新于 2026-03-24</p>
</div>
</div>
<div class="mt-6 flex gap-4 overflow-x-auto no-scrollbar">
<div class="bg-white/20 p-3 rounded-2xl min-w-[100px]">
<p class="text-[9px] opacity-80">BMI</p>
<p class="text-sm font-bold">21.4 (正常)</p>
</div>
<div class="bg-white/20 p-3 rounded-2xl min-w-[100px]">
<p class="text-[9px] opacity-80">体脂率</p>
<p class="text-sm font-bold">18.5%</p>
</div>
<div class="bg-white/20 p-3 rounded-2xl min-w-[100px]">
<p class="text-[9px] opacity-80">基础代谢</p>
<p class="text-sm font-bold">1640 kcal</p>
</div>
</div>
</div>
<!-- Constitution Analysis -->
<div class="report-section">
<h3 class="text-sm font-bold text-[#6B4F4F] mb-4 flex items-center gap-2">
<iconify-icon icon="solar:chart-square-bold"></iconify-icon>
                    核心体质偏向
                </h3>
<div class="w-full h-48" id="radarChart"></div>
<div class="mt-4 p-4 bg-gray-50 rounded-2xl">
<p class="text-xs text-gray-500 leading-relaxed italic">
                        "您的体质目前偏向于<span class="text-[#A1C298] font-bold">气虚质</span>，伴随轻微<span class="text-[#D4B996] font-bold">湿热</span>。建议春季以补气健脾、化湿理气为主。"
                    </p>
</div>
</div>
<!-- Metrics History -->
<div class="report-section">
<h3 class="text-sm font-bold text-gray-800 mb-4">指标趋势</h3>
<div class="space-y-4">
<div class="flex items-center justify-between">
<span class="text-xs text-gray-500">空腹血糖</span>
<span class="text-sm font-bold text-gray-800">5.2 mmol/L</span>
<span class="text-[10px] text-green-500 font-bold">↓ 2%</span>
</div>
<div class="flex items-center justify-between">
<span class="text-xs text-gray-500">总胆固醇</span>
<span class="text-sm font-bold text-gray-800">4.8 mmol/L</span>
<span class="text-[10px] text-red-400 font-bold">↑ 5%</span>
</div>
<div class="flex items-center justify-between">
<span class="text-xs text-gray-500">尿酸值</span>
<span class="text-sm font-bold text-gray-800">320 μmol/L</span>
<span class="text-[10px] text-gray-300 font-bold">-</span>
</div>
</div>
</div>
<!-- Advice -->
<div class="report-section border-dashed border-[#A1C298] bg-[#A1C298]/5">
<h3 class="text-sm font-bold text-[#A1C298] mb-2">专家建议</h3>
<p class="text-xs text-gray-600 leading-relaxed">
                     目前各项指标基本平衡。建议加强下肢力量训练，多摄入深绿色蔬菜。近期注意作息规律，避免熬夜伤肝。
                 </p>
</div>
</div>
</div>
<script>
        const chartDom = document.getElementById('radarChart');
        const myChart = echarts.init(chartDom);
        const option = {
            radar: {
                indicator: [
                    { name: '气虚', max: 100 },
                    { name: '湿热', max: 100 },
                    { name: '阴虚', max: 100 },
                    { name: '气郁', max: 100 },
                    { name: '血瘀', max: 100 }
                ],
                shape: 'circle',
                splitNumber: 4,
                axisName: { color: '#8E8E93', fontSize: 10 },
                splitLine: { lineStyle: { color: '#F2F2F7' } },
                splitArea: { show: false }
            },
            series: [{
                type: 'radar',
                data: [{
                    value: [80, 45, 30, 20, 15],
                    name: '体质数据',
                    itemStyle: { color: '#A1C298' },
                    areaStyle: { color: 'rgba(161, 194, 152, 0.4)' },
                    lineStyle: { width: 1 }
                }]
            }]
        };
        myChart.setOption(option);
    </script>
</body>
</html>
